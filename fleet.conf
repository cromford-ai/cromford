# Retire directive (V1 alert hygiene): "# @retired <project> [box]", read by
# bin/fleet-conf.sh --retired. Alert routing downgrades DOWN/SILENT lines naming
# a retired project or box to info, and bin/alerts-hygiene-sweep.sh resolves its
# open console rows. Delete the directive when a project comes back.
# @retired project-10       box-project-10-1
# @retired project-10-nav   box-project-10-1
# @retired project-10-navbe box-project-10-1
# @retired project-10-c   box-project-10-1
