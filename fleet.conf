# fleet.conf — the project registry. ONE line per watched project:
#   <project> <github-repo-slug> <prod-base-url> <board-api-prefix> <cron-offset-minute> [box] [tailnet_ip]
# Consumed by bin/fleet-conf.sh (bootstrap-machine.sh, prod-url.sh, healthcheck, tickets).
# On a box in REGISTRY_SOURCE=db the live copy is the D1 registry export written by
# bin/registry-export.sh. This committed copy is a seed and a human reference; change rows with bin/registry.sh.
# - project: the harness-wide name; must match prompts/<project>.md and env/<project>.env
# - board-api-prefix: where the app serves its product-board API (differs per app)
# - cron-offset: triage fires at offset,offset+10,...,offset+50 past each hour; keep
#   offsets distinct across projects sharing one LLM account to stagger load.
# - box (6th col, optional): the fleet box that owns this project's watcher —
#   "local" = the hub itself. Missing box falls back to the legacy naming
#   convention box-<project-minus-"-os"> (bin/box-for.sh). Small
#   projects share box-small (added 2026-08-18; loaded via
#   bin/load-project.sh).
# - tailnet_ip (7th col, optional): the tailnet address of that box. ADDED
#   2026-09-11 to retire the per-script IP tables — nine scripts each carried
#   their own copy keyed on a project or a short box label, so a box that moved
#   had to be found in nine places and the registry could not answer "where is
#   this project's box" at all. Read it through `bin/fleet-conf.sh --tailnet-ip
#   <project>` or `--tailnet-ip-of-box <box>`; NEVER hardcode it again.
#   Empty means UNKNOWN, and every caller must fail closed on that rather than
#   ssh to `root@` — an empty target is a hang, not an error.
# BUILD CONCURRENCY IS NOT IN THIS FILE, and this note is here because that is the
# first place people look. The box-wide cap is BUILD_SLOTS in env/global.env on the
# box itself (0 = unlimited, the default since 2026-09-13 — builds never queue
# behind each other; over a positive cap a build answers BUILD_DEFERRED and is
# re-offered next tick, it never waits). Per-project: flags/wip-limit-<project>
# locally, bin/pool-cap.sh on the Fly pool. docs/BUILD-CONCURRENCY.md has the
# whole table and `bin/concurrency-plan.sh` prints which cap actually binds.
# Operators running their own fleet: replace these rows with your own projects.
# Standby directive (#401): "# @standby <box> <hub-name> <hub-id>", read by bin/fleet-conf.sh --standby.
# @standby box-small box-hub hub
project-1   example-org/project-1      https://os.project-1.example  /api/board                      2 box-project-1-1 10.0.0.12
project-2 example-org/project-2   https://os.project-2.example            /api/board                      4 box-project-2-1 10.0.0.2
project-3       example-org/project-3          https://os.project-3.example                 /api/feature-board              6 box-project-3-2 10.0.0.3
project-4       example-org/project-4          https://os.project-4.example                  /api/accounting/requests-board  8 box-project-4-1 10.0.0.4
