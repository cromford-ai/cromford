# ci/ci-image.conf — what ci/ci-image.sh builds (BH-7256 project-layer kit).
# image= the GHCR name of this repo's CI image, lowercase, no tag. One line.
# input= a file ci/Dockerfile COPYs, one per line. ci/Dockerfile and this conf
# are always inputs. A COPY source with no input= line changes the image
# without moving its tag.
image=ghcr.io/example-org/REPLACE-WITH-REPO-NAME-ci
input=package.json
input=package-lock.json
