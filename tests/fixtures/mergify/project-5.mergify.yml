# .mergify.yml — example-org/project-5
#
# THE FILE THE REPO CARRIES, kept here as a fixture so this repo's own suite
# (tests/hotfix-mergify-template-test.sh, run with MERGIFY_FIXTURE=) parses the
# real thing and not only the template it was copied from. Mergify reads
# .mergify.yml from the repo's DEFAULT BRANCH, so the copy that matters lives in
# example-org/project-5 and lands through its own PR; this one is evidence, never
# configuration.
#
# Generated by `bin/mergify-template.sh render config/mergify/repos/project-5.conf`;
# tests/mergify-template.bh-1673-test.sh fails if the two differ by a byte.
# The check name is project-5's real required check (docs/MERGE-CONDUCTOR.md
# section 6's protection table).
merge_queue:
  # Batches built speculatively at once; each one costs CI runner minutes (ceiling 8 in bin/mergify-template.sh).
  max_parallel_checks: 6

queue_rules:
  # FIRST IN THE FILE IS FIRST IN LINE: the hotfix queue is above default, and it
  # takes `fix-main-red` PRs only. `hotfix` is the pool's build-priority label and
  # queues in default like any other PR (BH-2121).
  - name: hotfix
    queue_conditions:
      - base=main
      - label=fix-main-red
      # BH-2275: a standing changes-requested review keeps a PR out (and dequeues it).
      - "#changes-requested-reviews-by=0"
      - "check-success=Build + Unit tests"
    merge_conditions:
      # ... and a batch holding one cannot merge (BH-2275).
      - "#changes-requested-reviews-by=0"
      - "check-success=Build + Unit tests"
    merge_method: squash
    # An emergency never shares a batch and never waits to fill one. Not a knob.
    batch_size: 1
    batch_max_wait_time: 0 s
    max_checks_retries: 0
    checks_timeout: 45 min
  - name: default
    # The PR's own CI must be green before it may enter the queue ...
    queue_conditions:
      - base=main
      # BH-2275: a standing changes-requested review keeps a PR out (and dequeues it).
      - "#changes-requested-reviews-by=0"
      # A PR the main-red breaker paused leaves the queue, whatever queued it (BH-8706).
      - -label=merge-queue-paused
      - "check-success=Build + Unit tests"
    # ... and the batch, built on current main, must be green before it merges.
    merge_conditions:
      # ... and a batch holding one cannot merge (BH-2275).
      - "#changes-requested-reviews-by=0"
      - "check-success=Build + Unit tests"
    merge_method: squash
    # A batch is all-or-nothing: one red PR ejects every sibling in it.
    batch_size: 4
    batch_max_wait_time: 3 min
    # A retry hides a real failure and costs another CI run: 0 by default; a repo can opt into one for flaky shards.
    max_checks_retries: 1
    # Explicit so a slow run is not dequeued by an `auto` timeout.
    checks_timeout: 45 min

# Interrupts running batches, so it fires for a main-red fix only (BH-2121).
priority_rules:
  - name: hotfix first
    conditions:
      - label=fix-main-red
    priority: high
    allow_checks_interruption: true

pull_request_rules:
  - name: queue a hotfix at the head of the line
    conditions:
      - base=main
      - label=merge-queue
      - label=fix-main-red
    actions:
      queue:
        name: hotfix
  - name: queue on the harness label
    conditions:
      - base=main
      - label=merge-queue
      # Everything else: without this a fix-main-red PR matches both rules.
      - -label=fix-main-red
      # ... and a PR the main-red breaker paused waits out of the queue (BH-8706).
      - -label=merge-queue-paused
    actions:
      queue:
        name: default
