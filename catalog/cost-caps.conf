# catalog/cost-caps.conf — what a PR is ALLOWED to cost, and the fleet's daily
# hard ceiling. Read ONLY through bin/lib/cost-budget.sh, which resolves,
# first hit wins:
#
#   1. $COST_CAPS_CONF          — the fixtures' override; cron never sets it
#   2. flags/cost-caps.conf     — machine-local, the lever that needs no deploy
#   3. this file                — a REVIEWED COMMIT that reaches every box on
#                                 harness-sync, which is why it is here and not
#                                 a constant in bin/pipeline-health.sh
#   4. the defaults below       — $100/PR, min 5 PRs, $4000/day fleet
#
# GRAMMAR — keyword-led, one row per line:
#
#   budget  <project> <usd_per_pr> [min_prs_for_rate]
#   default <usd_per_pr> <min_prs_for_rate>
#   ceiling <usd_per_day>                      # fleet-wide, 24h, hard
#
# THE OLD GRAMMAR IS REFUSED, NOT REINTERPRETED (2026-09-15). Until today this
# file held bare "<project> <usd>" rows meaning a flat $/24h cap, and
# pipeline-health defaulted to $300/project and $800/fleet when it was absent —
# which it was, on every box. Those numbers were written when the fleet merged
# a handful of PRs a day. On 2026-09-15 project-5 merged ~90 and the breaker
# paged "$1456 in 24h (cap $300)" four times before lunch: a stale threshold
# wearing the costume of a burn spike, which is worse than no alarm, because
# the next real one reads the same.
#
# A dollar cap per DAY cannot be right for both a 3-PR day and a 90-PR day. The
# cap that holds across both is a dollar cap per PR — a unit price, not a budget
# for how much work the fleet is allowed to do. So a legacy 2-field row is
# COUNTED AND NAMED by the resolver rather than read as a $/PR budget: $300/day
# silently becoming $300/PR would raise the bar 10x and page for nothing ever
# again, which is the same failure with the alarm switched off.
#
# HOW THE RATE IS COMPUTED (bin/pipeline-health.sh, "cost rate budget"):
#   spend  = state/cost/summary.json .projects[p].cost_24h minus product spend
#            (the same DELIVERY cost cost_per_merged_pr_7d has always used)
#   PRs    = .projects[p].merged_prs_24h, the harness author set, merged in 24h
#   rate   = spend / PRs, and the alert quotes all four numbers plus the top 3
#            stages by cost, because "over budget" with no breakdown sends
#            someone to read a CSV to find out which stage moved.
#
# NEVER DIVIDED BY A TINY COUNT. Under min_prs_for_rate on 24h the check falls
# back to the same arithmetic over 7d, and under it there too the project is not
# evaluated at all and is NAMED once a day in one line. One merged PR that
# happened to carry a decomposition's whole plan cost is not a budget breach.
#
# THE NUMBERS BELOW ARE MEASURED, not chosen (2026-09-15, state/cost). Two
# different figures, because the file gates one of them and the other is the
# sanity check on it.
#
# What this file gates — a project's WHOLE delivery spend over its merged PRs,
# so triage, abandoned builds and fix rounds are all in the numerator
# (summary.json .projects[].cost_per_merged_pr_*):
#
#   project              $/PR 7d   $/PR 24h   merged 7d
#   project-5              40.51      50.91         250
#   project-4                46.90      74.11          39
#   project-3                47.86      67.97          15
#   project-2          49.19          —           8
#   project-1            77.00          —           3
#   project-8    44.55          —           1
#
# The sanity check — ATTRIBUTED per-PR dollars, build dirs that name a PR
# (summary.json .cost_per_pr_by_repo_7d, and p50/mean over 7d/30d):
#
#   project              n7   p50_7  mean7   p90_7 |  n30  p50_30  mean30
#   project-5           294   17.88  22.46   36.67 |  305   18.25   22.50
#   project-4              26   15.04  25.45   69.94 |  150   27.41   40.57
#   project-3               7   24.03  23.73   49.34 |   55   34.75   40.46
#   project-2         5   31.99  33.73   55.92 |   53   24.08   25.37
#   project-1           0       -      -       - |   40   23.48   26.54
#   project-7             32   16.50  20.48   39.78 |   44   22.02   26.68
#   project-8   1   11.53  11.53       - |    3   21.57   19.01
#
# The budgets sit at roughly 2x the gated figure: high enough that the $74/PR
# day project-4 had on 2026-09-15 is not a page, low enough that a doubling is. Move
# a row when the work genuinely changed shape, and say why in the commit
# message; a threshold widened quietly is a gate quietly switched off.
#
# THE MIN COUNTS ARE VOLUME, not importance. project-5 merges ~90 PRs a day, so
# 10 is a fifth of a shift; the small repos merge a handful a WEEK, so 3 on the
# 7d fallback is the most that can be asked of them without the check never
# running at all.

default 100 5

budget project-5             85  10
budget project-4               95   5
budget project-3               95   5
budget project-2        100   5
budget project-1          155   3
budget project-7              85   5
budget project-8   90   3
budget project-6            100   3
budget project-9           100   3

# FLEET DAILY CEILING — the absolute brake, in dollars, over the INTRADAY
# ledger sweep (logs/cost.csv across the boxes, cost_usd column only), not over
# summary.json. Different number, deliberately: the rate above answers "are we
# paying too much per PR", this answers "is something running away right now",
# and a runaway shows in cost_usd minutes before the hourly rollup sees it. It
# is a LOWER bound (token-priced rows are not in it), which is the right
# direction for a brake and the wrong one for a report.
#
# Measured 2026-09-15: that sweep read $2,157-$2,228/24h across four alerts
# while the fleet was healthy. 4000 is ~1.8x the observed healthy day.
ceiling 4000
