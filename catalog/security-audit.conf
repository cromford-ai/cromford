# catalog/security-audit.conf — the pin and the default caps of
# bin/security-audit.sh (BH-7910). key=value, one per line, read by
# sa_conf_get (bin/lib/security-audit.sh).
#
# skill_sha is the upstream commit the runner checks out and verifies before it
# installs the skill. A later upstream change does not change what runs until a
# person moves this pin (and prompts/security-classes/PROVENANCE.md, BH-7911,
# which names the same sha).
# cap_usd and cap_minutes are the fallbacks of the settings rows
# security_audit.cap_usd and security_audit.cap_minutes (a --cap-* flag wins
# over both).
# sandbox_memory_kb, sandbox_cpus, sandbox_cpu_s and sandbox_file_kb are the
# caps bin/security-audit-sandbox.sh puts on one target command (docker
# --memory/--cpus; unshare-n ulimit -v/-t/-f). agent_timeout_margin_s is the
# seconds agent-call's own timeout runs past cap_minutes, so the runner's cap
# stops the session first. kill_grace_s is the wait between TERM and KILL.
skill_repo=https://github.com/cloudflare/security-audit-skill
skill_sha=c1c8a8c1471069fb0e188eeaff69b8e8db6564a8
skill_path=skills/security-audit
skill_name=security-audit
skills_cli_version=1.7.4
cap_usd=60
cap_minutes=240
sandbox_image=node:22-bookworm-slim
poll_s=30
sandbox_memory_kb=4194304
sandbox_cpus=2
sandbox_cpu_s=1800
sandbox_file_kb=1048576
agent_timeout_margin_s=300
kill_grace_s=30
