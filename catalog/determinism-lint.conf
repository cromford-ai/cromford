# catalog/determinism-lint.conf — what bin/test-determinism-lint.sh looks for.
#
# WHY THIS FILE EXISTS RATHER THAN CONSTANTS IN THE SCRIPT. Every pattern here
# is a judgement call that will be argued with (is `date -u +%F` in a shell test
# a leak? is a 2s sleep a race?), and an argument that can only be settled by
# editing a script is an argument nobody has. Resolution order, first hit wins:
#
#   1. $DETERMINISM_LINT_CONF                — the tests and one-off runs
#   2. flags/determinism-lint.conf           — the box-local override (gitignored,
#                                              the emergency lever that needs no deploy)
#   3. catalog/determinism-lint.conf         — THIS FILE: the reviewed commit that
#                                              reaches CI and every box on harness-sync
#   4. /root/harness/catalog/determinism-lint.conf
#
# There is no built-in fallback: a lint that cannot find its rules FAILS (rc 2)
# rather than scanning for nothing and reporting green.
#
# GRAMMAR (one directive per line, # comments, blank lines ignored):
#   file <ERE>                     a path the lint scans (union of all `file` lines)
#   skip <ERE>                     a path it never scans, even if `file` matched
#   scope <rule-name> <ERE>        a path this ONE rule also scans. A file matched
#                                  only by scope lines (no `file` line) runs only
#                                  the rules that name it; a test file still runs
#                                  every rule. An unknown rule name scans for
#                                  nothing — the conf is reviewed and --rules
#                                  prints the line.
#   pin  <ERE>                     a line that PINS TIME for its whole file; the
#                                  file is then exempt from the clock-* rules
#                                  (never from rand-* or race-*, which a clock pin
#                                  says nothing about, and never from
#                                  clock-rolling-window — see below)
#   rule <name> <error|warn> <sh|js|any> <ERE>
#   opt  <key> <value...>
#
# Severity: `error` fails the run (rc 1). `warn` prints and does not fail —
# used where the pattern is real but the existing corpus is overwhelmingly
# benign, so turning it red on day one would only teach people to blanket-waive.
#
# WAIVERS (in the test file itself, never here):
#   <leaky line>            # determinism: ok <reason>          one line
#   # determinism: ok-file <reason>                             the whole file
#   # determinism: ok-file <rule-name> <reason>                 one rule, whole file
# A waiver with no reason is itself a finding. `//` comments work the same.

# ── what counts as a test file ───────────────────────────────────────────────
file (^|/)tests?/[^/]*\.sh$
file (^|/)tests?/.*\.(js|mjs|cjs|ts|tsx)$
file -test\.sh$
file \.test\.(js|mjs|cjs|ts|tsx|py|sh)$
skip /(node_modules|\.git|dist|\.wrangler|coverage)/
skip (^|/)tests/fixtures/
# The tests-scratch-only check builds fixture trees that contain their own bin/.
# `skip (^|/)tests/fixtures/` does not reach them, and without this line the
# race-sigpipe scope below would start reading fixtures as product code. It
# drops nothing that was scanned before: no checks/**/bin/ path is in `--list`.
skip (^|/)checks/[^/]+/fixtures/.*/bin/

# ── what one rule ALSO scans (BH-1248) ───────────────────────────────────────
# race-sigpipe only. The pipeline it catches flakes a lane exactly as it flakes
# a test — bin/test-tamper-scan.sh dropped a real TEST-CHANGE: justification,
# bin/lib/mc/rebase.sh took THEIRS over a branch's own work, bin/lib/wake-class-push.sh
# classified a prompts/ push as not one. Widening the `file` selector instead
# would drag the other seven rules onto bin/: measured on this checkout, 24
# race-sleep + 3 rand-bash + 5 clock-rolling-window errors and 441 warnings that
# nothing asks anyone to fix, and race-sleep red on every cron lane's bounded poll.
scope race-sigpipe (^|/)bin/.*\.sh$
# date-empty-stamp is bin/-only, and unlike race-sigpipe it skips test files too:
# a suite plants stamps on purpose, a lane stamps from whatever it read (BH-1897).
scope date-empty-stamp (^|/)bin/.*\.sh$

# ── what counts as a time pin ────────────────────────────────────────────────
# The shapes that already appear in this repo, plus the standard fake-timer
# calls. `NOW=` earns its place because the shell idiom here is to capture ONE
# anchor at the top and derive every fixture from it — that file is internally
# consistent whatever the wall clock says.
pin (^|[^A-Za-z_])(FAKE_NOW|FIXED_NOW|TEST_NOW|MOCK_DATE|SOURCE_DATE|SOURCE_DATE_EPOCH)=
pin ^[[:space:]]*(export[[:space:]]+)?(local[[:space:]]+)?NOW=
pin (vi|jest|sinon)\.useFakeTimers
pin (^|[^a-z])faketime
pin Date\.now[[:space:]]*=

# ── the rules ────────────────────────────────────────────────────────────────
# A JS test that reads the real clock. Cheap to state why it is safe (relative
# arithmetic off one captured now), so the waiver carries that sentence.
rule clock-now-js       error js  Date\.now[[:space:]]*\(
rule clock-new-date     error any new Date\([[:space:]]*\)
# THE #360 RULE. A rolling window asked for by a file whose fixtures are frozen
# in calendar time is a test that goes red on a date nobody chose:
# worker/jobs/test/cost-anchored.test.js asked ?window=24h against fixtures
# pinned to 2026-09-14 and went red fleet-wide once the clock passed 14:00Z on
# 2026-09-15 (#355-#359 all inherited it). Guards, in the script: the file must
# carry absolute date literals AND no relative-time helper, and the PIN IS
# CHECKED PER LINE, not per file — the broken file already had a ?day= pin in
# another test, so a file-level pin would have read it as safe.
rule clock-rolling-window error any [?&](window|days|range|since|last|period)=
# Shell `date` rendering a CALENDAR field (not bare +%s epoch arithmetic) in a
# file with no time pin. warn, not error: ~100 call sites in this repo today and
# almost all of them derive an expectation and an actual from the same read.
rule clock-date-cmd     warn  sh  (^|[^a-z_])date[[:space:]][^|;&)]*\+[^%]*%[-_0-9]*[YFmdHbjVI]
rule rand-bash          error sh  \$RANDOM
rule rand-js            error js  Math\.random[[:space:]]*\(
# A foreground wait of race_sleep_min_s or more, used as synchronisation. Lock
# holders, backgrounded processes and bounded retry loops are excluded by
# race_sleep_skip_re — those are the shapes that are NOT a race.
rule race-sleep         error sh  (^|[^a-z_])sleep[[:space:]]+[0-9]
# A SHORT-CIRCUITING CONSUMER ON THE RIGHT OF A git PIPE (BH-1232). `git log
# --oneline <branch> | grep -q <subject>` is a coin flip under `set -o pipefail`,
# which 542 of this repo's 547 shell suites set: grep -q exits at the FIRST
# match, git goes on writing the rest of the history into a pipe nobody reads,
# takes SIGPIPE, and pipefail hands the `&&` git's 141 — so the assertion goes
# red while the thing it asserts is TRUE. Measured on the test host: 75 of 400
# runs of that one line, and it is what put main red at 4ffd1811 through
# tests/blocked-resolver-test.sh case 8e and sank the trains behind it.
# git is the producer named because it flushes per record, so it is the one in
# this corpus still writing after the match (a `cat` of a small file has already
# written everything before grep can match). The answers: capture first
# (`grep -q X <<<"$(git …)"`), ask git the question (`merge-base --is-ancestor`,
# `log --grep`), or use a consumer that reads to EOF (`grep -c`).
# BH-1248: this is the one rule with a `scope` line (bin/**.sh above), because a
# lane flakes on the shape exactly as a test does; and the consumer alternation
# carries grep's long spellings — `--max-count`, `--quiet`, `--silent` — which
# are the same short circuit as -m and -q. `--count` is NOT one: it reads to EOF.
rule race-sigpipe       error sh  (^|[^A-Za-z_])git[[:space:]][^|]*\|[[:space:]]*(head([[:space:]]|$)|grep[^|]*[[:space:]](-[A-Za-z]*[qm][A-Za-z]*([^A-Za-z]|$)|--(max-count|quiet|silent)([=[:space:]]|$)))
# A SHORT-CIRCUITING CONSUMER ON THE RIGHT OF A printf/echo PIPE (BH-6109).
# `printf '%s\n' "$X" | grep -q y` is the race-sigpipe trap with a different
# writer: when $X is bigger than one pipe buffer, grep -q exits at the first
# match, printf takes SIGPIPE on the rest, and pipefail hands the pipeline 141,
# so a TRUE match reads as a miss. Not a coin flip: with ~800 KB in $X it is a
# miss every run. tests/llm-call-ratchet-test.sh hit it (PR #6108), and
# race-sigpipe above names only a git producer, so no rule caught it. The fix:
# read from a here-string, `grep -q y <<<"$X"`, or `grep -q y < <(printf …)`
# when the bytes must stay exact (no trailing newline, `head -c`). The consumer
# alternation is race-sigpipe's, byte for byte. The producer arguments skip a
# balanced `$(…)`, so `echo "$(id -u) $(printf x | wc -c)"` is not read as an
# echo in a pipe. Quotes are NOT masked: an eval'd string carries a real pipe.
# Test files only for now; a later slice of BH-6109 sweeps bin/ and then adds
# the bin/ scope line next to race-sigpipe's.
rule race-sigpipe-echo  error sh  (^|[^A-Za-z_])(printf|echo)[[:space:]]([^|()]|\$\([^|()]*\))*\|[[:space:]]*(head([[:space:]]|$)|grep[^|]*[[:space:]](-[A-Za-z]*[qm][A-Za-z]*([^A-Za-z]|$)|--(max-count|quiet|silent)([=[:space:]]|$)))
# A NEGATIVE CHECK FED BY A PIPE INTO grep -q (BH-1818). `cmd | grep -q X &&
# bad "X must not appear" || ok` passes FALSELY under pipefail: when X IS there,
# grep -q exits at the first match, cmd takes SIGPIPE (141), the pipeline fails
# and `|| ok` fires — the check reports a pass in exactly the case it exists to
# catch. `! cmd | grep -q X` reads a present X as absent the same way. Found in
# review of #1817; tests/rollup-crash-loud-test.sh §5 catches only the file-grep
# spelling and race-sigpipe above only a git producer, so no gate caught the
# general shape. A POSITIVE check (`… && ok || bad`) is not flagged: it fails
# loudly instead of passing quietly. The ERE below is only the prefilter; the
# script reads the whole statement with quotes masked and fires only when the
# pipe is `!`-negated or heads an && chain ending in an assertion verb
# (sigpipe_negative_assert_re). The fix: read the output first, grep -q X
# <<<"$(cmd)". Test files only — no scope line: bin/ has no assertions.
rule sigpipe-negative   error sh  \|[[:space:]]*grep[[:space:]]([^|]*[[:space:]])?(-[A-Za-z]*q[A-Za-z]*|--quiet|--silent)([[:space:]]|$)
# A "THIS BRANCH MUST NOT TOUCH X" ARM WITH NO OWN-SLICE GATE (BH-1261). A suite
# that captures its own checkout's diff against main and calls bad/eq/fail on a
# path in it runs on EVERY PR's CI, so it goes red on whoever edits that path
# next — for their own ticket, with nothing to fix. 2026-09-21: #1158 went red
# on tests/inapp-prompt-blocked-rule.bh-903-test.sh for editing worker/, #727 on
# tests/file-children.bh-981-test.sh for editing bin/triage-gate.sh on BH-590.
# #1260 gated those two by hand; this is the class. The block is quiet when a
# code line in it gates on the ticket's spec dir (.harness/specs/BH-N/) or
# declares the path the suite owns (own-slice:). A capture whose block asserts
# nothing is judging a fixture TREE, not a branch, and never fires.
rule branch-arm-ungated error sh  diff[[:space:]]+--name-only[^|]*(origin/main|\$\{?(BASE|MB|MERGE_BASE|REF|B)\}?([^A-Za-z0-9_]|$))
# AN EMPTY STAMP IS TODAY'S MIDNIGHT (BH-1897, BH-1816, #1815). GNU `date -u -d ""`
# exits 0 and prints today's 00:00:00Z, so `e=$(date -u -d "$x" +%s) || fallback`
# never takes the fallback when $x is empty: the lane goes on with a real-looking
# epoch nobody wrote. The script judges every `date -d "$VAR"` on the line and is
# quiet when each VAR has a guard on a non-comment line within
# date_guard_lookback lines above (or on the same line). A guard is a `[ -n "$VAR" ]`
# (`[[`, `test`) test, or a `-z` test that leaves the call behind on its own line:
# `[ -z "$VAR" ] || ...`, or `&&` / `; then` into return, exit, continue or break.
# `head -n "$VAR"`, `grep -n "$VAR"`, `[ ! -n ]` and `[ -z ] && date ...` are not
# guards (BH-1901). An error since BH-1901: every bin/ site is guarded or waived,
# see docs/notes/2026-09-24-BH-1816-date-empty-stamp.md. Scope: bin/ only (above).
# The name must NOT start with clock-: a NOW= pin says nothing about an empty
# variable, and a clock-* rule is exempt in a pinned file.
rule date-empty-stamp   error sh  (^|[^A-Za-z_])date[[:space:]][^|;&]*-d[[:space:]]*"\$\{?[A-Za-z_0-9]+(:-[^}"]*)?\}?"

# race-wall-bound (BH-6508): an elapsed wall-clock capture in a shell test, the
# `SECONDS=0` reset or an `X=$((SECONDS - t0))` / EPOCHSECONDS capture. A bound
# on it reads the runner's load, not the code. stuck-work-dispatch AT-1a did
# `SECONDS=0; dispatch; D1=$SECONDS; [ "$D1" -le 5 ]` and on 2026-10-13, at gate
# load 50-120, it went red on #6482 (19 s), #6475 (7 s) and #6496 (7 s), PRs that
# did not touch stuck-work. Assert the order of events instead: a marker the slow
# stub sets, still unset when the call returns. A start capture (`s0=$SECONDS`),
# a deadline (`END=$((SECONDS + 11))`) and a deadline loop bound a wait and are
# not matched. Warn, not error: 18 lines in 12 other suites still carry the shape.
# The name must NOT start with clock-: a NOW= pin does not stop a wall-clock
# bound from stretching, and a clock-* rule is exempt in a pinned file.
rule race-wall-bound    warn  sh  (^|[^A-Za-z_0-9])(SECONDS=0([^0-9]|$)|[A-Za-z_][A-Za-z_0-9]*=\$\(\([[:space:]]*\$?\{?(SECONDS|EPOCHSECONDS)\}?[[:space:]]*-)

# ── knobs ────────────────────────────────────────────────────────────────────
# A date literal that will not move on its own.
opt absolute_date_re (19|20)[0-9][0-9]-[0-9][0-9]-[0-9][0-9]
# "this file builds its fixtures relative to now" — the correct pattern, and the
# reason clock-rolling-window stays quiet in worker/jobs/test/dora.test.js.
opt relative_time_re Date\.now[[:space:]]*\(|new Date\([[:space:]]*\)|\*[[:space:]]*(DAYS|HOURS|MINUTES|MIN|SECS?)([^A-Za-z_]|$)|(days|hours|minutes|weeks) ago|iso\(|-d "@|-d '@
# A same-line anchor that makes a windowed call deterministic.
opt day_pin_re [?&](day|date|as_of|anchor|at)=|=(19|20)[0-9][0-9]-[0-9][0-9]-[0-9][0-9]
# Not a race: a lock holder, a backgrounded process, a bounded retry loop, a
# timeout's own argument.
opt race_sleep_skip_re flock|exec -a|timeout[[:space:]]|(^|[^&])&([[:space:]]|$)|(^|[^a-z_])(seq|until|while|for|do)[[:space:]]
# Seconds. Sub-second settles after a background launch are the accepted idiom
# here; anything at or above this is a wait long enough to be worth a condition.
opt race_sleep_min_s 2
# What makes a branch arm this ticket's own: the ticket's spec directory, or the
# path the block declares for itself in a trailing `# own-slice: <paths>`. The
# trailing slash is NOT required after the number, because the gate is itself a
# regex and a block that covers two sibling tickets writes it as a character
# class — tests/priority-rank-test.sh gates on `.harness/specs/BH-64[45]/`.
opt branch_arm_gate_re \.harness/specs/[A-Z]+-[0-9]|own-slice:
# What counts as judging the diff rather than just reading it. render-rules' B6
# arm uses eq, hotfix-lib's uses bad; has/hasnt are not on branch diffs anywhere
# in this corpus today, and widening this list is a conf edit, not a patch.
opt branch_arm_assert_re (^|[^A-Za-z0-9_])(bad|eq|fail)[[:space:]]
# The command quoted as prose in a SKIP message is not an arm.
opt branch_arm_skip_re ^[[:space:]]*(echo|printf)[[:space:]]
# Where "the same block" ends: a blank line, or a ── / ---- / ==== case header.
opt branch_arm_break_re ^[[:space:]]*$|^[[:space:]]*#[[:space:]]*(──|─|-{4,}|={4,})
# The assertion verbs that make a piped grep -q a NEGATIVE check when an &&
# chain from it ends in one (sigpipe-negative). bad and fail are the two this
# corpus uses; a braced `{ bad …; }` counts.
opt sigpipe_negative_assert_re (bad|fail)
# How many lines above a `date -d "$VAR"` call (plus the call line itself) may
# carry the `-n`/`-z` test that guards VAR, for date-empty-stamp.
opt date_guard_lookback 6
# How many warn lines to print per rule before collapsing to a count. CI output
# that scrolls is CI output nobody reads.
opt warn_show 8
