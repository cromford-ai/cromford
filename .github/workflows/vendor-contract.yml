# .github/workflows/vendor-contract.yml — the real-vendor contract suites
# (BH-7974, slice BH-7939.0; iron law BH-7563 rule 4). Every
# tests/contract/*.contract-test.sh runs here and never in the PR loop
# `tests/*.sh tests/mc/*.sh`: on a push to main, nightly, by hand, and on a PR
# that touches a vendor seam or a contract suite. One job, one run at a time.
# A vendor failure (no secret, a curl failure, a 429/5xx) is a SKIP line and a
# ::warning::, not a red run.
name: vendor-contract

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  pull_request:
    paths:
      - 'bin/lib/vendor/**'
      - 'tests/contract/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-contract
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One worker: a single-entry matrix so max-parallel has a matrix to bound.
    strategy:
      max-parallel: 1
      matrix:
        worker: [1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: contract suites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -uo pipefail
          for t in tests/contract/*.contract-test.sh; do bash "$t" || exit 1; done
