# THE ONBOARDING GITHUB CONTRACT (BH-7997, iron law BH-7563 rule 4). The PR
# suites read GitHub only through the fake in bin/lib/onboard-github.sh
# (ONBOARD_GITHUB_FAKE); this workflow is where the seam meets the real vendor:
# tests/contract/onboard-github.bh-7935-contract-test.sh, five reads, one job.
# It runs on main, once a night, on demand, and on a PR that changes the seam
# or the contract file. A runner with no App credential prints
# `SKIP: no App credential` and passes; a vendor that does not answer is a
# `SKIP: vendor unverifiable` with a ::warning::, never a red run (rule 7).
# The workflow name carries "nightly" so bin/main-red-detector.sh's skip regex
# never reads a vendor outage here as main being red.
name: Onboard GitHub contract (nightly)
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'bin/lib/onboard-github.sh'
      - 'tests/contract/onboard-github*'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch: {}
concurrency:
  group: onboard-github-contract-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  contract:
    name: onboard-github contract
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the real-GitHub contract suite (1 worker)
        run: bash tests/contract/onboard-github.bh-7935-contract-test.sh
