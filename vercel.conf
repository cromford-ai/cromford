# vercel.conf — which Vercel project serves each product's prod domain.
# Consumed by bin/vercel-deploy-snapshot.sh (hub only; watcher boxes hold no
# Vercel credentials by design — they read the pushed snapshot instead).
#   <project> <teamId> <projectId> <prod-domain>
# CAREFUL (project-3): TWO project-3 projects exist. os.project-3.example is served by the one
# in team project-3, NOT the project-12 copy — verified against /v9/projects/{id}/domains
# on 2026-08-13. Re-verify before ever pointing this row at the project-12 project.
# 2026-09-03: the project-12 copy (team_EXAMPLE0000000000000000 /
# prj_EXAMPLE00000000000000000004) was DISCONNECTED from example-org/project-3
# (DELETE /v9/projects/{id}/link). It had no env vars, so its "Vercel – project-3"
# check was permanently red on every PR — the "phantom context" that held project-3
# PRs UNSTABLE for the merge sweep. If that check ever reappears, someone re-linked it.
project-1   team_EXAMPLE0000000000000000 prj_EXAMPLE00000000000000000000 os.project-1.example
project-2 team_EXAMPLE0000000000000000 prj_EXAMPLE00000000000000000001 os.project-2.example
project-4       team_EXAMPLE0000000000000000 prj_EXAMPLE00000000000000000002 os.project-4.example
project-3       team_EXAMPLE0000000000000001 prj_EXAMPLE00000000000000000003 os.project-3.example
project-6-os  team_EXAMPLE0000000000000000 prj_EXAMPLE00000000000000000005 os.example.com
