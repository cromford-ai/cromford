# fly/onboard-queue.conf — projects waiting to be put on the Fly builder pool.
# `<project> <queued-at UTC ISO>`, one per line. Synced to every box by
# harness-sync; the HUB is the only box that acts on it.
#
# WHY A FILE IN THE REPO. Onboarding runs on the hub (bin/fly-onboard.sh mints
# org tokens from the hub's flyctl session), and most sessions cannot ssh to the
# hub. A merged line reaches it on its own: bin/fleet-propagate.sh (*/5) syncs
# fly/ into /root/harness/fly/, and bin/fly-pool-tick.sh (*/2) drains this file
# there by running `bin/fly-onboard.sh <project>`. Same channel, same reasoning
# as fly/pool-caps.conf — a reviewed commit, not a one-liner typed over ssh.
#
# Written by `bin/load-project.sh <owner/repo> --fly`, or by hand + merge.
# A line whose project is ALREADY routed is inert — the drain skips it and
# bin/fly-onboard.sh would answer ALREADY anyway. A line stays after a
# successful onboarding (it is the history of who was queued when) and is safe
# to delete whenever.
#
# RETRIES ARE BOUNDED. Each attempt spends an image build and a probe machine,
# so the drain keeps a ledger in state/fly-onboard/<project>.attempts and
# .last on the hub: FLY_ONBOARD_MAX_ATTEMPTS attempts (default 3),
# FLY_ONBOARD_RETRY_MIN minutes apart (default 360), both in env/global.env.
# After the last one it writes ONE line to logs/ALERTS.log naming the failing
# step and stops. To retry after a give-up, on the hub:
#   rm /root/harness/state/fly-onboard/<project>.attempts \
#      /root/harness/flags/alerted-fly-onboard-gaveup-<project>
# (or just run /root/harness/bin/fly-onboard.sh <project> there).
#
# Each project line below is a routing decision and it is reviewed as one.
# Tests copy only this header (comment and blank lines), never the lines below.
