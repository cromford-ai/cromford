# fly/lane-run.toml — the Fly app `lane-run` (BH-6126, BH-6047 part 3 of 5).
#
# Its machines run bin/lane-run-worker.sh (fly/lane-run-entrypoint.sh) and
# claim lane_runs rows. This app is NOT the build pool app. It has no [[vm]]
# block and no services: machines are started and stopped only by
# bin/lane-fleet.sh on the hub, and their size comes from the settings rows
# lane_fleet.vm_size and lane_fleet.vm_memory_mb.
#
# One-time setup, by an operator, from the repo root:
#   flyctl apps create lane-run
#   flyctl secrets set HARNESS_SECRET=... JOBS_URL=... GH_APP_ID=... \
#     GH_APP_PRIVATE_KEY=... GH_APP_INSTALLATION_<OWNER>=... -a lane-run --stage
#   # BH-6260: the agent CLI credentials, the same ones the pool build machines
#   # get (the hub's CLAUDE_CODE_OAUTH_TOKEN from env/global.env, the file text
#   # of /root/.codex/auth.json and /root/.codex/config.toml):
#   flyctl secrets set CLAUDE_CODE_OAUTH_TOKEN=... CODEX_AUTH_JSON=... \
#     CODEX_CONFIG_TOML=... -a lane-run --stage
#   # BH-7516: the Fly token of a pool tick on a machine of a group app
#   # (bin/fly-pool-project.sh). FLY_API_TOKEN_<PROJECT> wins, else the org
#   # FLY_API_TOKEN (bin/lib/fly-token.sh). The entrypoint writes it to fly.env.
#   # Stage it from the hub's env file through stdin, so the value is never in
#   # argv or on screen (for lane-run-mk, the group of project-6-os). fly.env
#   # quotes the value (`FlyV1 ...` has a space): source it, and printf (a
#   # shell builtin, no process argv) writes the bare NAME=value line:
#   ( set -a; . /etc/harness/env/fly.env; \
#     printf 'FLY_API_TOKEN_project-6_OS=%s\n' "$FLY_API_TOKEN_project-6_OS" ) \
#     | flyctl secrets import -a lane-run-mk --stage
#   # BH-7848: the full list for a project: bin/lane-run-secrets.sh fly-pool
#   # <project> (and --stage-cmd <app> prints the stdin staging command).
#   JC=bin/jobs-client.sh
#   flyctl deploy . -c fly/lane-run.toml --build-only --push --image-label latest \
#     --build-arg HARNESS_COMMIT=$(git rev-parse HEAD) \
#     --build-arg NODE_VERSION=$($JC setting-get bake.node.version) \
#     --build-arg CLAUDE_CODE_VERSION=$($JC setting-get cli.claude_code.version) \
#     --build-arg CODEX_VERSION=$($JC setting-get cli.codex.version) \
#     --build-arg PLAYWRIGHT_VERSION=$($JC setting-get bake.playwright.version) \
#     --build-arg FLYCTL_VERSION=$($JC setting-get bake.flyctl.version)
#   The build FATALs when a version arg is empty (fly/bake-pin.sh and the
#   cli-pin-verify block): never "latest". Set the bake.flyctl.version row
#   (BH-7516) before the first build that has the bake-flyctl block.
# The deploy pushes registry.fly.io/lane-run:latest, the image the settings row
# lane_fleet.image names. GH_APP_PRIVATE_KEY is the PEM text; the entrypoint
# writes it to a mode-600 file at boot. No key is in the image. A machine
# pulls main of the harness repo with that App's token before its claims
# (bin/lib/lane-run-code.sh), so the installation must be able to read it.
app = "lane-run"

[build]
  dockerfile = "lane-run.Dockerfile"
