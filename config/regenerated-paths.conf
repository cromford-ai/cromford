# config/regenerated-paths.conf — PATHS A CONFLICT RESOLVES BY RE-RENDERING
#
# Every line names a committed file that a generator in the repo renders from
# other files in the tree, and the command that renders it. When the conductor's
# merge conflicts on one of these paths, mc_resolve_generated does not pick a
# side and does not union the two: it re-runs the command over the MERGED tree
# and stages what it writes.
#
# WHY THIS FILE EXISTS (BH-1162, found landing #1097, which rebased twice in an
# hour). docs/notes/INDEX.md is rendered by bin/render-doc-index.sh from the
# dated notes beside it. Two PRs that each add a note and re-render touch the
# same lines of it, so the second one conflicts on INDEX.md and on nothing
# else. The path has no ticket key, so the per-ticket rule in
# config/generated-paths.conf cannot claim it, and it fell to the `*.md` union
# arm, which glues both sides into a sorted index with rows out of order or
# twice. the operator's ruling (2026-09-24): "regenerate on conflict. Do not use
# merge=union."
#
# THE RULE, for a conflicted path listed here and only here:
#   * no ticket key is needed, in the path or the branch: the output depends
#     only on the merged tree
#   * every other conflicted path is settled first, so the generator never reads
#     a file with markers in it (a sibling still unmerged = a real conflict)
#   * the generator missing from the tree, failing, or writing markers, or a
#     modify/delete = a REAL conflict with the markers restored. It is never
#     handed to the union arm instead.
#
# TRUST. This file is harness-owned. The command runs from the root of the
# merged worktree, the same trust level as mc_regen_generated's regenerate
# after a rebase, so an edit here is guard-sensitive (bin/lib/guard-silenced.sh).
#
# FORMAT. `<path><TAB><command>`; `#` starts a comment; blank lines ignored.
# LITERAL paths only, matched exactly: no globs, because `*` spans `/` in a
# bash `case` and a glob here would re-render files nobody listed.
#
# Keep this in step with MC_REGENERATED_PATHS_DEFAULT in bin/lib/mc/rebase.sh,
# the fallback for a pool image that bakes bin/ and not config/.
# tests/regenerated-path-conflicts.bh-1162-test.sh fails when the two disagree.

# BH-6000 (2026-10-11): the committed renders a PR changes through their
# sources. A schema PR adds a worker/jobs/schema.d/ fragment and re-renders
# schema.sql, so any two schema PRs conflicted on schema.sql and the conductor
# parked them conflict-unresolvable (#5420 and 3 stacked children, #5892,
# #5956, #5907). rules/CLAUDE.md (rules/topics/) and docs/PR-OWNERSHIP.md
# (docs/PR-OWNERSHIP.d/) are the same shape.
# BH-6005 (2026-10-12): worker/jobs/schema.sql left git (.gitignore), so it
# left this table: a branch no longer commits it, so nothing conflicts on it.
# BH-5239.4 deleted the Cloud worker's schema, so its row went too.
# BH-8254 (2026-10-24): docs/notes/INDEX.md left git (.gitignore), so it left
# this table, the same way.
rules/CLAUDE.md	bin/render-rules.sh --write
docs/PR-OWNERSHIP.md	bin/render-doc-sections.sh --write
# BH-7452 (2026-10-25): .github/workflows/harness-ci.yml is the committed
# render of config/harness-ci/. Two PRs that each add a step at the same place
# conflict on the render alone; re-rendering the merged fragments settles it.
.github/workflows/harness-ci.yml	bin/render-ci-workflow.sh --write
