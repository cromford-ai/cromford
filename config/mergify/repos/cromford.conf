# config/mergify/repos/cromford.conf — this repo's own Mergify queue.
#
# Format (BH-1673, frozen by BH-1697). PARSED, NEVER SOURCED: one key=value per
# line, # starts a comment, blank lines are ignored. Keys:
#   slug                 required, owner/name
#   check                repeatable, at least one: a required check name
#   merge_method         squash|merge|rebase             (default squash)
#   batch_size           int 1..10                       (default 4)
#   batch_max_wait_time  a Mergify duration              (default 3 min)
#   checks_timeout       a Mergify duration              (default 45 min)
#   max_parallel_checks  int 1..8; >8 is refused, it multiplies CI
#                        runner minutes (docs/CI-RUNNERS.md)   (default 3)
#   max_checks_retries   int 0..2, default queue only; the hotfix
#                        queue stays 0                   (default 0)
#   base                 the queue base branch           (default main)
#   queue_check          repeatable, optional: the checks queue_conditions
#                        require (default: every check=). For a repo whose
#                        corpus runs only on the batch draft (2026-09-24)
#   status_check         repeatable, optional: a commit STATUS context the
#                        queue_conditions require after the queue checks;
#                        never in merge_conditions (BH-3348)
#   override             free-text reason: the repo keeps a hand-maintained
#                        .mergify.yml and sync leaves it alone
#   queue_mode           serial|parallel (default serial): parallel gives
#                        each impact partition its own lane via manual
#                        scopes (BH-4979, docs/MERGIFY.md)
#   scope_default_capacity  int 1..8, not above max_parallel_checks:
#                        batches per scope in parallel mode    (default 1)
#   batch_failure_attempts  int 0..8, optional, default queue only:
#                        renders batch_max_failure_resolution_attempts;
#                        0 = no bisect, the conductor's impact map ejects
#                        the culprit (BH-4980). Unset renders nothing
#   solo_label           optional, a lowercase label: renders the size-1
#                        `solo` queue and its routing rule (BH-5430)
#   flake_fix_label      optional, a lowercase label: renders the size-1
#                        `flake-fix` queue after hotfix, its routing rule
#                        and the solo/default exclusions (BH-7279)
# A key left out takes its default. The CLI that reads this file is
# bin/mergify-template.sh; its header has the interface.

slug=example-org/cromford
# The seven checks, copied verbatim from the root .mergify.yml — every one of
# them must pass on the batch draft before it merges (merge_conditions).
check=Syntax + shellcheck + config integrity
check=Test determinism lint
check=Pure-logic gate fixtures
check=Tests cannot touch a real harness
check=Mission Control SPA — unit tests + build
check=Jobs worker — routes + schema
check=Prompt replay evals (prompts/** only)
# EACH TREE IS TESTED EXACTLY ONCE (the operator, 2026-09-24). An ordinary PR runs only
# the three fast checks below; the other four (the test corpus, the SPA, the
# jobs worker) run only on the queue's batch draft. So a PR enters the queue on
# the fast checks (queue_conditions) and the batch merges on all seven
# (merge_conditions, evaluated on the draft).
queue_check=Syntax + shellcheck + config integrity
queue_check=Test determinism lint
queue_check=Prompt replay evals (prompts/** only)
# THE VERDICT GATE (BH-3348). #3307 merged at 4f4b3f914 while its only lead
# verdict (#176) bound af9842fb1, a commit that never reached GitHub: nothing
# here asked for a verdict, so anyone who added `merge-queue` and posted
# `@Mergifyio queue` could land an unreviewed head. `lead-verdict` is a commit
# status published only on a head a verdict binds to: bin/lead-verdict.sh post
# (lead|human MERGE / MERGE-WITH-NOTES = success, BLOCK = failure) and the
# conductor's mc_enqueue_mergify, after its own head-bound verdict. A push
# leaves the new head with none. queue_conditions only, both queues: the batch
# draft's sha never carries it, so merge_conditions would stall every batch,
# and a queue condition that stops matching dequeues the PR anyway.
status_check=lead-verdict
# With queue and merge checks different, Mergify never checks a PR in place:
# every batch, even a batch of one, is a draft that runs the corpus once.
# MERGE, not squash: this repo allows merge commits only.
merge_method=merge
# 6, 2 min (the operator, 2026-10-22, BH-8047, CI cost hotfix). MonkCI billed $9,284
# for 1,160,553 4-vCPU minutes. About 54 batches a day each paid a full impact
# run (409-1,038 suites, about 265 min). 6 PRs per batch and a 2-min wait give
# about 12 batches a day. The union impact set of 6 PRs is smaller than 6
# separate sets. Was 4 / 3 min (2026-10-08, caps audit: 83% of batch runs red),
# 8 / 3 min (2026-09-24). Rollback: batch_size=4, batch_max_wait_time=3 min
# here, then edit .mergify.yml to match (docs/CI-RUNNERS.md).
batch_size=6
batch_max_wait_time=2 min
# 0 RETRIES, 60 MIN (2026-09-24, "each tree tested once").
# Every batch is now a full-corpus run (~16 jobs, ~160 billed min), so the cost
# of a red batch is what decides the bill. With 8 speculative batches stacked
# and one retry, one bad PR at the head re-ran the head batch and threw away 7
# stacked ones: ~15-17 corpus runs. With 0 retries and 4 in flight it is the
# red batch plus at most 3 discarded, and the split bisects from there: ~5-7.
# The timeout covers the plan job + a 45-minute shard + the fan-ins.
max_checks_retries=0
# NO BISECT ON THE DEFAULT QUEUE (the operator, 2026-10-17, BH-5373, 6229144964).
# Mergify dequeues every member of a red batch and does not split it. The
# merge conductor's impact map (MC_BATCH_IMPACT=2) ejects the one PR that
# reaches the failing suite and re-queues the others; none or several go to
# the solo re-run (BH-4550). Hotfix and solo queues are batch_size 1 and
# are unchanged. Rollback: delete this line and re-render .mergify.yml, and
# set lane.merge-conductor.cromford.mc_batch_impact=1.
batch_failure_attempts=0
# 3 SPECULATIVE BATCHES (the operator, 2026-10-12, BH-6337). A failed or dequeued lower
# batch restarts every batch above it. On 2026-10-12 #5920 failed 4 batches, and
# one manual dequeue (#6039, 22:32Z) restarted #6327 (#5443 + #5454), about
# 25 min. Most batches ran the full corpus (25-30 min).
# REVISIT after #5454 (the batch runs only changed-fingerprint suites) and the
# pre-queue learned-suite gate merge. If a batch then costs about 10 min and the
# batch failure rate is below 20%, raise this value again.
# Was 8 (2026-09-28, throughput over CI minutes); 4 before that (#2220). 8 is
# still the template ceiling (bin/mergify-template.sh INTS).
max_parallel_checks=3
checks_timeout=60 min
# IMPACT LANES, SHIPPED DARK (BH-4979). The conductor computes each PR's impact
# partition (bin/lib/queue-partition.sh) and logs it as a PARTITION line; in
# parallel mode it uploads it as Mergify scopes before the label. This stays
# serial until MERGIFY_CI_KEY is minted and a live PUT probe rides the flip PR,
# which changes this line to parallel and sets queue_partition.mode=enforce
# (the checklist is in docs/MERGIFY.md, "Parallel lanes"). 2026-10-17
# (BH-5373): the hub still has no key, so this stays serial (NEEDS_HUMAN).
queue_mode=serial
scope_default_capacity=1
# THE SOLO LANE (BH-5430). On 2026-10-08 one risky PR failed its batch of 8 and
# every speculative batch stacked behind it, and Mergify's bisect held all
# merges for more than 1.5 hours. The conductor scores each PR before enqueue
# (bin/lib/queue-risk.sh, queue_risk.* settings rows) and adds this label to a
# high scorer before merge-queue; the label routes it to the `solo` queue
# (batch_size 1), so it takes nobody down with it. Rollback: queue_risk.mode=off,
# then delete this line and re-render .mergify.yml (docs/MERGIFY.md).
solo_label=queue-solo
# THE FLAKE-FIX LANE (BH-7279). On 2026-10-17 the fix for a suite that kept
# failing merge-queue batches (#7194, tests/staff-watchman.bh-5565-test.sh)
# waited in default behind the batches that suite failed. The conductor adds
# this label before merge-queue when a PR changes a suite on the batch-fail
# list (bin/prequeue-learned.sh --list --why) and touches only the fix scope
# (bin/lib/queue-flake-fix.sh, flake_fix.* settings rows); the label routes it
# to the `flake-fix` queue (batch_size 1), first in line after hotfix.
# Rollback: flake_fix.mode=off, then delete this line and re-render
# .mergify.yml (docs/MERGIFY.md).
flake_fix_label=queue-flake-fix
