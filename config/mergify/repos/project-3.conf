# config/mergify/repos/project-3.conf — example-org/project-3's Mergify queue.
# Format: see config/mergify/repos/cromford.conf (parsed, never sourced).
# Added 2026-10-20 (the operator approved). Branch protection on main is strict:false, so
# cromford[bot] merged a PR that was behind main on its own branch's CI read.
# #459 (TK-286) was tested on a base without #452, merged 39 minutes after it,
# and broke the production build's test step (rolled back, re-landed in #467).
# A queue tests each PR on top of main first. The four ci.yml jobs run on every
# pull_request, so they run on the batch draft too.
# BH-10079 (2026-11-25, owner-approved CI audit, example-org/project-3#1409): the
# three E2E shards are merge conditions. e2e.yml runs them in full on every
# batch draft (project-3#1406), but only path-filtered on an ordinary PR head, so
# they are check= (merge_conditions, the draft) and NOT queue_check= (admission,
# the PR head). Two PRs merged over a red E2E before this (#1369, #1373).
# Rollback: drop the three check=E2E lines and the queue_check= lines.
slug=example-org/project-3
queue_check=Unit Tests
queue_check=Type Check
queue_check=Test Coverage Gate
queue_check=Schema Drift Check
check=Unit Tests
check=Type Check
check=Test Coverage Gate
check=Schema Drift Check
check=E2E Tests (Shard 1/3)
check=E2E Tests (Shard 2/3)
check=E2E Tests (Shard 3/3)
# BH-10042 (2026-11-25): batch 4, 3 batches in parallel. On 2026-11-24, 11 PRs
# waited and 8 PRs needed 75 min at batch 2 x 2. Rollback: both lines back to 2.
batch_size=4
batch_max_wait_time=3 min
# BH-10079: 45 min (was 30). Real drafts after project-3#1406 ran E2E for 17.7
# and 17.8 min; a draft before it took 30.2 min; failing specs and runner waits
# add more. 45 min is the template default.
checks_timeout=45 min
max_parallel_checks=3
max_checks_retries=1
# BH-9625 (project-3, 2026-11-12) set status_check=harness-verdict for
# lead_authority_mode=client: the conductor published harness-verdict only
# after la_decide passed, and lead-verdict was refused because a human post
# publishes it before the conductor decided.
# 2026-11-24 (the operator, "fix the queue rule"): project-3 is in lead_authority_mode=lane
# since 2026-11-23 (client mode off). In lane mode a lead or human verdict
# publishes lead-verdict (lr_clear_context, bin/lib/lead-required.sh), and the
# queue read only harness-verdict, so 5 owner-approved PRs (#1368 to #1372)
# stayed out of the queue with every other condition green. The queue now
# takes either status, as cromford does (BH-9039). A failure of either
# name still holds the PR out.
# IF project-3 GOES BACK TO CLIENT MODE: set this line back to
# status_check=harness-verdict in the same change.
status_check_any=lead-verdict|harness-verdict
