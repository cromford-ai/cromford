# config/mergify/repos/project-3.conf — example-org/project-3's Mergify queue.
# Format: see config/mergify/repos/cromford.conf (parsed, never sourced).
# Added 2026-10-20 (the operator approved). Branch protection on main is strict:false, so
# cromford[bot] merged a PR that was behind main on its own branch's CI read.
# #459 (TK-286) was tested on a base without #452, merged 39 minutes after it,
# and broke the production build's test step (rolled back, re-landed in #467).
# A queue tests each PR on top of main first. The four ci.yml jobs run on every
# pull_request, so they run on the batch draft too; e2e.yml is path-filtered
# and advisory (E2E policy, 2026-09-12), so it is not a queue check.
slug=example-org/project-3
check=Unit Tests
check=Type Check
check=Test Coverage Gate
check=Schema Drift Check
batch_size=2
batch_max_wait_time=3 min
checks_timeout=30 min
max_parallel_checks=2
max_checks_retries=1
