# config/mergify/repos/project-2.conf — example-org/project-2's Mergify queue.
# Format: see config/mergify/repos/cromford.conf (parsed, never sourced).
# Added 2026-10-20 (the operator approved). Before this, cromford[bot] merged each PR
# directly after its own CI read, ours and partner's alike, and only `classify` and
# `freshness` were required on main. TK-358 (#623) passed review on its branch and
# then conflicted after #621/#622 merged; a queue tests each PR on top of main first.
# `tests` (TK-370, .github/workflows/tests.yml: typecheck + impact-selected suites,
# vendor-call budget) and `guardrails` both run on pull_request, so they run on the
# batch draft too. Volume is 1 to 9 merges a day, so batches stay small.
slug=example-org/project-2
check=tests
check=guardrails
batch_size=2
batch_max_wait_time=3 min
checks_timeout=30 min
max_parallel_checks=2
max_checks_retries=1
