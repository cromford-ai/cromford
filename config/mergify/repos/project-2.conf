# config/mergify/repos/project-2.conf — example-org/project-2's Mergify queue.
# Format: see config/mergify/repos/cromford.conf (parsed, never sourced).
# Added 2026-10-20 (the operator approved). Before this, cromford[bot] merged each PR
# directly after its own CI read, ours and partner's alike, and only `classify` and
# `freshness` were required on main. TK-358 (#623) passed review on its branch and
# then conflicted after #621/#622 merged; a queue tests each PR on top of main first.
# `tests` (TK-370, .github/workflows/tests.yml: typecheck + impact-selected suites,
# vendor-call budget) and `guardrails` both run on pull_request, so they run on the
# batch draft too. Volume is 1 to 9 merges a day, so batches stay small.
slug=example-org/project-2
check=tests
check=guardrails
batch_size=2
batch_max_wait_time=3 min
# 45 min, not 30: Mergify counts runner queue time against this, and the `tests` job has
# `timeout-minutes: 30`, so 30 here dequeued a slow batch as "timed out" and not as failed
# (review of example-org/project-2#630, 2026-10-22).
checks_timeout=45 min
max_parallel_checks=2
# 0: this repo had 0 flaky reds in 94 (7 days to 2026-11-23, hub flake-rate line), so a
# retry buys nothing and can turn a real intermittent failure into a merge (same review).
max_checks_retries=0
# A PR enters the queue only with a harness verdict STATUS on its exact head: `lead-verdict`
# (a lead or human MERGE row) or `harness-verdict` (a builder-only clearance, BH-9039). A commit
# status is bound to one sha, so a push after review takes the PR out of the queue until the new
# head is reviewed, and a `merge-queue` label alone admits nothing. That matters here because a
# second harness (partner) opens PRs on this repo and can add labels; on 2026-11-23,
# project-2#861 merged before its review finished (review of #630, note 2).
# Fail-closed: if no verdict status is published on a head, that PR does not queue. Once this
# repo has a .mergify.yml, the conductor does not merge around the queue (bin/lib/mc/queue.sh),
# so a repo where the App cannot write statuses would hold every harness PR. The cromford
# App has `statuses: write` on all repos (checked 2026-11-24), and mc_status_unpublished_alert
# pages once a day if a cleared head has no status. A person can still merge by hand on GitHub.
status_check_any=lead-verdict|harness-verdict
